; PlatformIO config for the Waveshare ESP32-C6-LCD-1.47 port
; of claude-desktop-buddy.
;
; Board details: ESP32-C6-MINI-1U module with ESP32-C6FH8 (8MB flash), ST7789
; 172x320 LCD, single user button on GPIO9 (BOOT), WS2812 RGB on GPIO8,
; native USB JTAG. The 8MB flash is used in full to enable OTA — see
; partitions/ota_8mb.csv for the layout.
;
; pioarduino is used instead of the stock platformio/espressif32 because
; only its arduino-esp32 v3.x core supports the ESP32-C6.

[env:waveshare-esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
; The arduino-esp32 v3.x bootloader for ESP32-C6 is built in DIO mode —
; flashing the app in QIO leaves the chip stuck in a TG0_WDT reset loop
; right after the ROM bootloader prints `ets_loader.c 67`. Match it.
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_build.partitions = partitions/ota_8mb.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB

build_src_filter = +<*> +<buddies/>

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    ; ---- LovyanGFX uses its own board class (see M5Shim) so no User_Setup. ----
    ; ---- Waveshare-specific board pins for the M5Shim ----
    -DWAVESHARE_C6_LCD_147=1
    -DBOOT_BUTTON_GPIO=9
    -DRGB_LED_GPIO=8
    -DLCD_BL_GPIO=22
    ; ---- OTA configuration ----
    ; Version compared against GitHub release tag_name (strip leading 'v').
    ; Bump for every release; CI can override via env if you wire it up.
    -DFIRMWARE_VERSION='"0.1.0"'
    -DOTA_OWNER='"hartmanfrost"'
    -DOTA_REPO='"claude-desktop-buddy"'
    -DOTA_ASSET='"firmware-waveshare-c6.bin"'

lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit NeoPixel @ ^1.12.5
    h2zero/NimBLE-Arduino @ ^2.2.1
